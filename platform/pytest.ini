[pytest]
# platform/ is deliberately NOT a Python package: a top-level `platform` package
# shadows the stdlib module of the same name, and anything calling
# platform.python_implementation() -- attrs, and transitively rich and several
# pytest plugins -- breaks on import with a confusing AttributeError.
#
# So the import root is platform/ itself, giving `src.*` and `workers.*`.
pythonpath = .
testpaths = tests
asyncio_mode = auto
