# Prometheus 3.14 scrape configuration.
#
# Two families of target, and the second is the one most projects skip:
# the platform scrapes the application it observes, AND it scrapes itself.
# A tracing pipeline that cannot tell you it is dropping spans is a tracing
# pipeline you cannot trust, and the failure is silent by construction --
# dropped spans leave no trace, which is the whole problem.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: tracemap-local
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ---------------------------------------------------------------- RED
  # spanmetrics, generated by the collector BEFORE the sampling decision
  # (M12). Generating them after tail sampling would scale every rate by the
  # sampling ratio, so a 20% baseline sample would make the dashboards read
  # five times low -- and read plausibly, which is worse than reading zero.
  - job_name: otel-collector-spanmetrics
    static_configs:
      - targets: ["otel-collector:8889"]
    metric_relabel_configs:
      # Probe traffic is not user traffic. Leaving it in inflates request
      # rates and drags the latency histogram toward zero, which flatters
      # every percentile on the golden-signals dashboard.
      - source_labels: [http_route]
        regex: "/(healthz|readyz|metrics)"
        action: drop

  # -------------------------------------------------- pipeline self-monitoring
  # accepted vs refused vs dropped spans, exporter queue depth, and the
  # persistent-queue size. This is where a storage blip shows up as data loss
  # rather than as an empty dashboard nobody questions.
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]

  # ------------------------------------------------------- platform workers
  # tracemap_worker_cycle_total is the heartbeat every self-monitoring alert
  # keys off. Its ABSENCE is the signal -- a worker that stops without
  # crashing looks perfectly healthy from every other surface.
  - job_name: tracemap-workers
    static_configs:
      - targets:
          - "trace-assembler:9100"
          - "graph-builder:9101"
          - "anomaly-detector:9102"
          - "deploy-watcher:9104"
    # No relabel adding a `worker` target label. The metric already carries
    # one, and a target label of the same name does not overwrite it --
    # Prometheus renames the metric's own label to `exported_worker` and every
    # alert matching {worker="anomaly_detector"} silently stops matching. A
    # heartbeat rule that quietly selects nothing is the exact failure the
    # heartbeat rules exist to catch.

  - job_name: tracemap-analytics-api
    metrics_path: /metrics
    static_configs:
      - targets: ["analytics-api:8090"]

  # ClickHouse serves this only when <prometheus> is enabled in its config.
  # Left in and expected to be down on the default local stack: a target that
  # is honestly down is better than a metric quietly missing from the storage
  # panels, and the cost model reads from here.
  - job_name: clickhouse
    static_configs:
      - targets: ["clickhouse:9363"]
