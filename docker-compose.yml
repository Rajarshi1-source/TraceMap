# TraceMap — Phase 1 stack: the traced application, no tracing yet.
#
# Profiles let a laptop run a subset:
#   core   services + datastores          (this phase)
#   full   + Prometheus, Grafana          (Phase 7; D2 keeps them OUT of core so
#          the 8 GB CX32 has headroom against the ~7 GB measured floor)
#   eval   + injectors and the runner     (Phase 7)
#
# Phase 2 adds otel-collector and jaeger; Phase 3 adds clickhouse.

name: tracemap

x-fault-env: &fault-env
  # M23: every fault flag defaults to zero/off and is read per request.
  TRACEMAP_FAULT_DELAY_MS: ${TRACEMAP_FAULT_DELAY_MS:-0}
  TRACEMAP_FAULT_ERROR_RATE: ${TRACEMAP_FAULT_ERROR_RATE:-0}
  TRACEMAP_FAULT_ENDPOINT: ${TRACEMAP_FAULT_ENDPOINT:-}
  TRACEMAP_FAULT_CPU_BURN_MS: ${TRACEMAP_FAULT_CPU_BURN_MS:-0}
  TRACEMAP_FAULT_TTL_S: ${TRACEMAP_FAULT_TTL_S:-600}

x-otel-env: &otel-env
  # M24 - service.version rides on every span as a resource attribute. Deploy
  # attribution (Phase 6) and trace-to-code both key off this one line.
  OTEL_RESOURCE_ATTRIBUTES: "service.version=${GIT_SHA:-dev-local},deployment.environment=local"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  # Head sampling OFF: the collector's tail sampler decides, once it can see the
  # whole trace. Enabling both without meaning to is a classic way to silently
  # sample twice.
  OTEL_TRACES_SAMPLER: parentbased_always_on
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none

x-svc-common: &svc-common
  restart: unless-stopped
  profiles: [core, full, eval]

services:
  # ---------------------------------------------------------------- datastores
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracemap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-tracemap}
    volumes:
      # PostgreSQL 18+ expects a single mount at /var/lib/postgresql, NOT at
      # /var/lib/postgresql/data. The image stores data in a major-version
      # subdirectory so `pg_upgrade --link` works without crossing a mount
      # boundary; mounting the old path makes it refuse to start.
      - pgdata:/var/lib/postgresql
      - ./microservices/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracemap}"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: [core, full, eval]

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: [core, full, eval]

  clickhouse:
    image: clickhouse/clickhouse-server:26.3-alpine
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-tracemap}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-tracemap}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change-me-locally}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - chdata:/var/lib/clickhouse
      # 0*.sql run once, in order, on an empty data directory.
      - ./clickhouse/schema:/docker-entrypoint-initdb.d:ro
    ports:
      - "8123:8123"     # HTTP
      - "9000:9000"     # native
    healthcheck:
      # Probes the NATIVE port (9000), not just HTTP (8123), because 8123
      # answers /ping before 9000 accepts connections -- and 9000 is the port
      # the consumers actually use. Jaeger pings ClickHouse once at startup and
      # exits(1) on refusal, so "healthy" meaning "HTTP is up" let it race the
      # native listener and die. A readiness check has to mean ready for the
      # thing that depends on it.
      #
      # 127.0.0.1, NOT localhost. Inside the container `localhost` resolves to
      # ::1 first, and the image binds ::1 only when IPv6 is available on the
      # network - which it is not here, so the probe gets connection refused
      # while the server is perfectly healthy on IPv4.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping >/dev/null && clickhouse-client --host 127.0.0.1 --port 9000 --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    profiles: [core, full, eval]

  # ------------------------------------------------------------------ tracing
  # Both jaeger and the collector run as uid 10001, but a fresh named volume is
  # created root-owned because its mount path does not exist in either image.
  # This one-shot init fixes ownership before they start. It is the compose
  # equivalent of the initContainer the Helm chart needs in Phase 7 - keeping
  # both containers non-root is worth one extra service.
  volume-init:
    image: alpine:3.22
    command: ["sh", "-c", "mkdir -p /jaeger /queue && chown -R 10001:10001 /jaeger /queue"]
    volumes:
      - jaegerdata:/jaeger
      - otelqueue:/queue
    profiles: [core, full, eval]

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    # The feature gate is required by STORAGE_PROFILE=clickhouse and is inert
    # for badger and opensearch. Jaeger refuses to start the ClickHouse backend
    # without it, and says why: the storage is experimental and its schema is
    # subject to breaking changes. That warning is the reason profiles exist.
    command: ["--config", "/jaeger/config.yaml", "--feature-gates=storage.clickhouse"]
    environment:
      # Only used by the clickhouse storage profile.
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-tracemap}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change-me-locally}
    volumes:
      # One env var swaps the storage backend. Depending on an alpha feature
      # (native ClickHouse) is acceptable; depending on it with no tested
      # fallback is not.
      - ./jaeger/jaeger-${STORAGE_PROFILE:-badger}.yaml:/jaeger/config.yaml:ro
      - jaegerdata:/var/lib/jaeger
    depends_on:
      volume-init: { condition: service_completed_successfully }
      # Under STORAGE_PROFILE=clickhouse, Jaeger pings ClickHouse once while
      # starting and exits(1) if it is refused -- there is no retry. Without
      # this edge it raced the database and died, which is why the badger
      # profile passed CI and the clickhouse one did not. The dependency is
      # harmless under badger: ClickHouse is in the core profile either way.
      clickhouse: { condition: service_healthy }
    ports:
      - "16686:16686"     # UI
    healthcheck:
      # The image is distroless (no shell, no curl), so the binary probes
      # itself. `version` exits 0 only once the process is up.
      test: ["CMD", "/cmd/jaeger/jaeger-linux", "version"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    profiles: [core, full, eval]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    command: ["--config", "/etc/otel/collector-gateway-config.yaml"]
    environment:
      # The clickhouse exporter reads these via ${env:...} in the config.
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-tracemap}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-tracemap}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change-me-locally}
    volumes:
      - ./otel:/etc/otel:ro
      - otelqueue:/var/lib/otelcol/queue    # M15 - persistent sending queue
    ports:
      - "8889:8889"       # spanmetrics -> Prometheus scrape
      - "13133:13133"     # health_check
    depends_on:
      volume-init: { condition: service_completed_successfully }
      clickhouse: { condition: service_healthy }
      jaeger: { condition: service_started }
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    profiles: [core, full, eval]

  # ------------------------------------------------------------------ services
  gateway-svc:
    <<: *svc-common
    build: ./microservices/gateway
    environment:
      <<: [*fault-env, *otel-env]
      OTEL_SERVICE_NAME: gateway-svc
      SERVICE_NAME: gateway-svc
      SERVICE_VERSION: ${GIT_SHA:-dev-local}     # M24
      PORT: 3000
      ORDER_URL: http://order-svc:3001
      PRODUCT_URL: http://product-svc:8080
    ports: ["3000:3000"]
    depends_on:
      otel-collector: { condition: service_started }
      order-svc: { condition: service_healthy }
      product-svc: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  order-svc:
    <<: *svc-common
    build: ./microservices/order
    environment:
      <<: [*fault-env, *otel-env]
      OTEL_SERVICE_NAME: order-svc
      SERVICE_NAME: order-svc
      SERVICE_VERSION: ${GIT_SHA:-dev-local}
      PORT: 3001
      USER_URL: http://user-svc:8000
      PRODUCT_URL: http://product-svc:8080
      PAYMENT_URL: http://payment-svc:8001
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-tracemap}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      PGDATABASE: ${POSTGRES_DB:-tracemap}
    # Ports are published for local development and for the eval harness, which
    # drives /_internal/fault on these services. The Helm chart in Phase 7 does
    # NOT expose them: the fault control plane must never be reachable from a
    # public ingress.
    ports: ["3001:3001"]
    depends_on:
      otel-collector: { condition: service_started }
      postgres: { condition: service_healthy }
      user-svc: { condition: service_healthy }
      product-svc: { condition: service_healthy }
      payment-svc: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  user-svc:
    <<: *svc-common
    build: ./microservices/user
    environment:
      <<: [*fault-env, *otel-env]
      OTEL_SERVICE_NAME: user-svc
      SERVICE_NAME: user-svc
      SERVICE_VERSION: ${GIT_SHA:-dev-local}
      PORT: 8000
      SVC_USER_BASE_MS: ${SVC_USER_BASE_MS:-30}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-tracemap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-tracemap}
    ports: ["8000:8000"]
    depends_on:
      otel-collector: { condition: service_started }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz',timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12

  payment-svc:
    <<: *svc-common
    build: ./microservices/payment
    environment:
      <<: [*fault-env, *otel-env]
      OTEL_SERVICE_NAME: payment-svc
      SERVICE_NAME: payment-svc
      SERVICE_VERSION: ${GIT_SHA:-dev-local}
      PORT: 8001
      SVC_PAYMENT_BASE_MS: ${SVC_PAYMENT_BASE_MS:-90}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-tracemap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-tracemap}
    ports: ["8001:8001"]        # the eval harness drives /_internal/fault here
    depends_on:
      otel-collector: { condition: service_started }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/healthz',timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12

  product-svc:
    <<: *svc-common
    build:
      context: ./microservices/product
      args:
        GIT_SHA: ${GIT_SHA:-dev-local}
    environment:
      <<: [*fault-env, *otel-env]
      OTEL_SERVICE_NAME: product-svc
      SERVICE_NAME: product-svc
      SERVICE_VERSION: ${GIT_SHA:-dev-local}
      PORT: 8080
      SVC_PRODUCT_BASE_MS: ${SVC_PRODUCT_BASE_MS:-45}
      PRODUCT_N_PLUS_ONE_THRESHOLD: ${PRODUCT_N_PLUS_ONE_THRESHOLD:-3}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-tracemap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-tracemap}
    ports: ["8080:8080"]
    depends_on:
      otel-collector: { condition: service_started }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/product", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ------------------------------------------------------------------ platform
  trace-assembler:
    build: ./platform
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-tracemap}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-tracemap}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change-me-locally}
      ASSEMBLE_INTERVAL_S: ${ASSEMBLE_INTERVAL_S:-15}
      LATE_SPAN_GRACE_S: ${LATE_SPAN_GRACE_S:-30}
      METRICS_PORT: 9100
    ports:
      - "9100:9100"     # heartbeat + worker metrics
    depends_on:
      clickhouse: { condition: service_healthy }
    restart: unless-stopped
    profiles: [core, full, eval]

  analytics-api:
    build: ./platform
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8090"]
    environment: &platform-env
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-tracemap}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-tracemap}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change-me-locally}
      REDIS_URL: redis://redis:6379/0
      GIT_SHA: ${GIT_SHA:-dev-local}
      CORS_ORIGINS: http://localhost:3002
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-tracemap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-tracemap}
    ports:
      - "8090:8090"
    depends_on:
      clickhouse: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/healthz',timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    profiles: [core, full, eval]

  graph-builder:
    build: ./platform
    command: ["python", "-m", "workers.graph_builder_worker"]
    environment:
      <<: *platform-env
      METRICS_PORT: 9101
      GRAPH_BUILD_INTERVAL_S: ${GRAPH_BUILD_INTERVAL_S:-10}
    ports:
      - "9101:9101"
    # The image's default healthcheck probes 9100 (the assembler's port). This
    # worker serves metrics on 9101, so the probe is overridden rather than
    # making the Dockerfile guess which worker it is running.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9101/metrics',timeout=2).status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 6
      start_period: 10s
    depends_on:
      clickhouse: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    profiles: [core, full, eval]

  anomaly-detector:
    build: ./platform
    command: ["python", "-m", "workers.anomaly_detector_worker"]
    environment:
      <<: *platform-env
      METRICS_PORT: 9102
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-tracemap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-tracemap}
      DETECT_INTERVAL_S: ${DETECT_INTERVAL_S:-60}
      DETECTOR_ALPHA: ${DETECTOR_ALPHA:-0.2}
      DETECTOR_THRESHOLD_MS: ${DETECTOR_THRESHOLD_MS:-50}
      DETECTOR_MIN_REQUESTS: ${DETECTOR_MIN_REQUESTS:-100}
      DETECTOR_SUSTAINED_CYCLES: ${DETECTOR_SUSTAINED_CYCLES:-3}
      DETECTOR_ERROR_RATE_THRESHOLD: ${DETECTOR_ERROR_RATE_THRESHOLD:-0.02}
      DETECTOR_MIN_BLAME_SHARE: ${DETECTOR_MIN_BLAME_SHARE:-0.05}
      DETECTOR_WARMUP_CYCLES: ${DETECTOR_WARMUP_CYCLES:-5}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      JAEGER_BASE: ${JAEGER_BASE:-http://localhost:16686}
      DASHBOARD_BASE: ${DASHBOARD_BASE:-http://localhost:3002}
      # M20 - the dangerous feature ships OFF.
      AUTO_ROLLBACK_ENABLED: ${AUTO_ROLLBACK_ENABLED:-false}
    ports:
      - "9102:9102"
    depends_on:
      clickhouse: { condition: service_healthy }
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9102/metrics',timeout=2).status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    profiles: [core, full, eval]

  deploy-watcher:
    build: ./platform
    command: ["python", "-m", "workers.deploy_watcher_worker"]
    environment:
      <<: *platform-env
      METRICS_PORT: 9104
      DEPLOY_CONTROL_PORT: 9103
    ports:
      - "9103:9103"     # POST /_internal/deploy - eval case 011 drives this
      - "9104:9104"
    depends_on:
      clickhouse: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9103/healthz',timeout=2).status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    profiles: [core, full, eval]

  dashboard:
    build: ./dashboard
    environment:
      # Server components talk to the API inside the network; the browser talks
      # to it through the published port.
      ANALYTICS_API_URL: http://analytics-api:8090
      NEXT_PUBLIC_API_BASE: http://localhost:8090
    ports:
      - "3002:3002"
    depends_on:
      analytics-api: { condition: service_healthy }
    restart: unless-stopped
    profiles: [core, full, eval]

  # ---------------------------------------------------------------- monitoring
  #
  # `full` profile only. D2 keeps Prometheus and Grafana OUT of `core` so the
  # 8 GB target host has headroom against the ~7 GB measured floor -- adding a
  # gigabyte of monitoring to a box already at its limit turns a demo into an
  # OOM kill, and the thing that dies first is ClickHouse.
  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus-rules.yml:/etc/prometheus/rules/tracemap.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    profiles: [full]

  grafana:
    image: grafana/grafana:13.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-change-me-locally}
      # Anonymous viewing is convenient for a local demo and is exactly the
      # setting that must not survive to a public host. It is scoped to Viewer
      # so a link cannot edit a dashboard, and the Helm chart does not set it.
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANON:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3003:3000"
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    profiles: [full]

volumes:
  pgdata:
  chdata:
  jaegerdata:
  otelqueue:
  promdata:
  grafanadata:
