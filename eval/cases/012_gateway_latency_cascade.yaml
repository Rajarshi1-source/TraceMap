name: gateway_latency_cascade
family: cascade
description: >
  +250ms of order-svc's own work, before the fan-out starts. The slowdown
  originates at the top of the call chain and propagates downward through
  everything gateway-svc sees.

  The detector must blame the origin edge and nothing below it. This is the
  mirror image of every other case here: those check that blame does not spread
  sideways to parallel siblings, and this one checks that it does not spread
  DOWNWARD to innocent descendants. An attribution engine that lights up the
  whole subtree on one upstream regression is a heat map, not an answer.

  Note what is deliberately NOT a trap anywhere in this set: an edge's
  ancestors. An edge's critical-path time includes its callee's whole subtree,
  so a payment slowdown really does make gateway-svc->order-svc slower, and
  reporting that is correct. Only siblings and descendants are traps.
injector:
  type: latency
  target: order-svc
  endpoint: /orders
  delay_ms: 250
  duration_s: 600
load:
  script: load-testing/normal-checkout-flow.js
  rps: 20
expect:
  edge: "gateway-svc->order-svc"
  detect_within_s: 480
  must_not_alert:
    - "order-svc->payment-svc"
    - "order-svc->product-svc"
    - "order-svc->user-svc"
