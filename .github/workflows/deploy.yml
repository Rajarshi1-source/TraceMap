name: deploy

# Tag-triggered deploy to the k3s node behind the public HTTPS URL.
#
# Two things here are worth more than the YAML around them.
#
# GIT_SHA is threaded from the tag through the image build into the chart and
# out onto every span as service.version (M24). That single value is what makes
# "this anomaly correlates with the release ninety seconds ago" answerable at
# all. Break the chain anywhere and deploy attribution has a hole exactly where
# the interesting incidents are.
#
# The post-deploy check is a real gate, not a notification. `helm upgrade
# --wait --atomic` rolls back on its own if pods never become ready, and the
# smoke test afterwards catches the case Helm cannot see: pods that are ready
# and wrong.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: git ref to deploy
        required: true

concurrency:
  # Never two deploys at once. Overlapping Helm upgrades against one release
  # produce a state neither run intended, and the deploy markers they write
  # make the anomaly correlation ambiguous afterwards.
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  GIT_SHA: ${{ github.sha }}
  NAMESPACE: tracemap
  RELEASE: tracemap

jobs:
  # A tag is not a licence to skip the gates. Building and shipping an image
  # whose tests were never run is how "it passed CI" becomes untrue quietly.
  verify:
    name: gates
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write

  publish:
    name: publish images
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - { name: gateway,   context: microservices/gateway }
          - { name: order,     context: microservices/order }
          - { name: user,      context: microservices/user }
          - { name: payment,   context: microservices/payment }
          - { name: product,   context: microservices/product }
          - { name: platform,  context: platform }
          - { name: dashboard, context: dashboard }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.ref_name }}
          # M24 again, at the only point where it can still be got right: the
          # SHA has to be baked in at build time, because backfilling it later
          # leaves a window of traces that can never be correlated to a release.
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  deploy:
    name: helm upgrade
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://${{ vars.TRACEMAP_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: azure/setup-helm@v4
      - name: kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: upgrade
        run: |
          helm upgrade --install "$RELEASE" charts/tracemap \
            --namespace "$NAMESPACE" --create-namespace \
            --set global.gitSha="${{ github.sha }}" \
            --set ingress.host="${{ vars.TRACEMAP_HOST }}" \
            --wait --atomic --timeout 10m
          # --atomic rolls back automatically if the release never becomes
          # ready. Without it a failed upgrade leaves the namespace in a state
          # that is neither the old version nor the new one, and the next
          # deploy inherits it.

      - name: record the deploy marker
        # Belt and braces: the in-cluster watcher records this from the
        # Deployment change, and this writes it explicitly so the marker exists
        # even if the watcher is the thing that just broke. Correlation with no
        # marker is not a wrong answer, it is no answer.
        run: |
          kubectl -n "$NAMESPACE" run deploy-marker --rm -i --restart=Never \
            --image=curlimages/curl:latest -- \
            -sf -X POST http://deploy-watcher:9103/_internal/deploy \
            -H 'Content-Type: application/json' \
            -d '{"service":"tracemap","revision":"${{ github.ref_name }}","git_sha":"${{ github.sha }}","trigger":"rollout"}' \
            || echo "marker POST failed; the watcher will still see the rollout"

      - name: post-deploy smoke
        # Helm's --wait proves the pods are READY. This proves they are RIGHT.
        # A readiness probe that answers 200 from a process that cannot serve
        # is the failure --wait cannot see, and it is not a rare one.
        env:
          HOST: https://${{ vars.TRACEMAP_HOST }}
        run: |
          set -e
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$HOST/api/graph?window=5" || echo 000)
            [ "$code" = "200" ] && break
            echo "attempt $i: $code"; sleep 10
          done
          [ "$code" = "200" ] || { echo "::error::graph API not answering"; exit 1; }

          # TLS must actually be valid, not merely present. A self-signed cert
          # that "works if you click through" is not a live HTTPS URL.
          curl -sf --max-time 10 "$HOST/api/graph?window=5" > /dev/null

          # M24 end to end: the deployed API reports the SHA it was built from.
          # If this drifts, every deploy correlation downstream is nonsense.
          reported=$(curl -s --max-time 10 "$HOST/api/openapi.json" | head -c 400 || true)
          echo "$reported" | head -c 200

      - name: write endpoints must be authenticated
        # The check that keeps a public demo from being a liability. An
        # unauthenticated fault-injection endpoint on the internet lets anyone
        # make the services slow; an unauthenticated rollback endpoint lets
        # them redeploy it.
        env:
          HOST: https://${{ vars.TRACEMAP_HOST }}
        run: |
          for path in /_internal/fault /api/rollback /api/rules; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                   -X POST "$HOST$path" -d '{}' || echo 000)
            echo "POST $path -> $code"
            case "$code" in
              401|403|404|405) ;;
              *) echo "::error::$path answered $code without auth"; exit 1 ;;
            esac
          done

      - name: rollback on smoke failure
        if: failure()
        run: |
          helm rollback "$RELEASE" --namespace "$NAMESPACE" --wait --timeout 5m
          echo "::warning::rolled back $RELEASE"
