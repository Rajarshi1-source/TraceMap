name: ci

# Everything that must be true of every commit, and nothing that takes an hour.
# The detector eval lives in eval.yml because a 45-minute gate on every PR
# trains people to route around CI, and a gate people avoid is worse than no
# gate at all (D5).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # M24: service.version rides on every span from day one. Injected at build
  # time so a container can say which commit produced it without asking git.
  GIT_SHA: ${{ github.sha }}

jobs:
  # ------------------------------------------------------------------ static
  lint:
    name: lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: install python tooling
        run: |
          python -m pip install --quiet ruff mypy
          python -m pip install --quiet -r platform/requirements.txt
          python -m pip install --quiet -r eval/requirements.txt
      - run: ruff check platform eval scripts
      - name: mypy
        run: mypy --ignore-missing-imports platform/src eval

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: eslint and tsc
        run: |
          cd dashboard && npm ci && npx tsc --noEmit

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: cd microservices/product && go vet ./...

  # ------------------------------------------------------------------- tests
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: order-svc, including the fan-out guard
        # M1. If this ever passes with a sequential fan-out, every edge lands
        # on the critical path, wall clock and critical path become identical,
        # and the flagship feature has nothing left to demonstrate -- while
        # nothing else in the suite fails.
        run: cd microservices/order && npm ci && npm test

      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - run: cd microservices/product && go test ./...

      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - name: platform tests, including the M6 baseline guard
        run: |
          python -m pip install --quiet -r platform/requirements.txt pytest pytest-asyncio
          cd platform && python -m pytest -q

      - name: eval harness tests
        # These are the ones that prove the GATE works: a deliberately broken
        # detector's results must fail scoring, and the regression check must
        # refuse a missing run and a cross-tier comparison. Exit criterion 5,
        # as a test rather than a screenshot.
        run: |
          python -m pip install --quiet -r eval/requirements.txt
          python -m pytest eval/tests -q -c eval/pytest.ini --rootdir=.

  # --------------------------------------------------------------- invariants
  guards:
    name: invariant guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - run: python -m pip install --quiet -r eval/requirements.txt
      - name: ClickHouse DDL invariants (M2, M3, M4, M16, F1)
        run: python scripts/schema-guard.py
      - name: the eval gate goes red on a broken detector
        # Exit criterion 5, on every commit rather than as a screenshot from
        # one afternoon. Feeds the scorer and the regression CLI the results
        # each way of breaking the detector would produce, and fails if any of
        # them come out green. Needs no stack, so it runs here rather than in
        # the eval workflow.
        run: python scripts/eval-gate-guard.py
      - name: skill archives are not stale
        run: python scripts/build-skills.py --check
      - name: M10 and M18 manifest invariants
        # Was two inline greps, and a grep for a forbidden string is itself a
        # file containing that string -- the M10 check matched the workflow
        # that defined it and failed on a clean tree. F11 recorded the same
        # self-matching shape against the Phase 3 criterion grep, so this is
        # the second time it has bitten. A script can exclude itself and skip
        # the comment that explains the rule; an inline pattern cannot.
        run: python scripts/manifest-guard.py

  # ------------------------------------------------------------------- build
  build:
    name: build and scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, order, user, payment, product]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ghcr.io requires a lowercase repository name and this one is
      # `Rajarshi1-source/TraceMap`. Interpolating github.repository directly
      # produces an invalid tag and buildx fails before it builds anything.
      - name: lowercase the image repository
        id: repo
        run: echo "slug=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: img
        with:
          context: microservices/${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.slug }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.slug }}/${{ matrix.service }}:latest
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/${{ steps.repo.outputs.slug }}/${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  # ------------------------------------------------------- storage fallback
  storage-profile-matrix:
    name: storage profile (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # This is what turns "I have a fallback" into "my fallback is tested".
    # An untested fallback is worse than none: it invites confidence that has
    # never been checked, which is the failure ADR 0002 exists to prevent.
    strategy:
      fail-fast: false
      matrix:
        profile: [clickhouse, badger]
    steps:
      - uses: actions/checkout@v4
      - name: boot with STORAGE_PROFILE=${{ matrix.profile }}
        run: |
          make env
          STORAGE_PROFILE=${{ matrix.profile }} \
            docker compose --profile core up -d --wait
      # Invoked through bash, not executed directly: this repo is developed
      # on Windows, which has no exec bit, so a newly added script arrives
      # mode 100644 and `./script.sh` fails with a bare "Permission denied".
      - run: bash ./scripts/smoke-test.sh
      - name: prove traces land in this profile
        run: bash ./scripts/profile-matrix.sh ${{ matrix.profile }}
      - if: always()
        run: docker compose --profile core logs --tail=120

  # ----------------------------------------------------------------- k6 SLO
  k6-slo-gate:
    name: k6 SLO gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: make env && docker compose --profile core up -d --wait
      - name: warm up
        # The first thirty seconds include JIT, connection-pool fill and cold
        # caches. Measuring them would make the SLO a statement about process
        # startup rather than about the service.
        run: |
          docker run --rm --network tracemap_default \
            -v "$PWD/load-testing:/scripts" \
            -e SHORT=1 -e RPS=10 -e DURATION=30s \
            -e BASE_URL=http://gateway-svc:3000 \
            grafana/k6 run /scripts/normal-checkout-flow.js
      - name: measure
        # RPS is 10 here, not the 50 the SLO is specified at, and the reason is
        # the runner rather than the service.
        #
        # A standard GitHub runner is 2 vCPU / 7 GB. This stack's MEASURED
        # component floor is ~7 GB (docs/SCALING.md) across sixteen containers,
        # so the runner is at its limit before a single request arrives. At 50
        # rps it produced p95 2.5s and a 2.37% error rate while only achieving
        # 44.7 of the requested 50 -- that is the runner saturating, not the
        # checkout path regressing, and gating on it would measure GitHub's
        # hardware budget.
        #
        # The THRESHOLDS below are unchanged: p95 < 400ms, errors < 1%. Only
        # the offered load is reduced, so this still catches a gross latency
        # regression while the 50 rps figure stays what it always was -- a
        # statement about the sized host (4 vCPU / 8 GB), which is where it
        # should be quoted from.
        run: |
          # The k6 image runs as uid 12345 while the workspace belongs to the
          # runner, so k6 could not write the summary into $PWD -- it printed
          # the text report and silently produced no file, and the enforcement
          # step below correctly refused to guess. A world-writable directory
          # sidesteps the uid mismatch without running the container as root.
          mkdir -p "$PWD/k6out" && chmod 777 "$PWD/k6out"
          set +e
          docker run --rm --network tracemap_default \
            -v "$PWD/load-testing:/scripts" -v "$PWD/k6out:/out" \
            -e SHORT=1 -e RPS=10 -e DURATION=120s \
            -e BASE_URL=http://gateway-svc:3000 \
            grafana/k6 run --summary-export=/out/k6-summary.json \
            /scripts/normal-checkout-flow.js
          k6_exit=$?
          set -e
          # Reported, not swallowed. The script carries its own thresholds and
          # exits 99 when they trip, which used to kill this step before the
          # summary could be read. A blanket `|| true` fixed that and hid
          # everything else -- k6 failing to start, or rejecting a flag -- which
          # is exactly how the missing summary went unexplained for a run.
          # 99 is the gate talking; anything else is k6 itself.
          echo "k6 exit: ${k6_exit}"
          cp "$PWD/k6out/k6-summary.json" k6-summary.json 2>/dev/null || true
      - name: enforce the SLO
        run: |
          test -f k6-summary.json || { echo "::error::k6 produced no summary"; exit 1; }
          P95=$(jq -r '.metrics.http_req_duration["p(95)"]' k6-summary.json)
          ERR=$(jq -r '.metrics.http_req_failed.value' k6-summary.json)
          RPS=$(jq -r '.metrics.http_reqs.rate' k6-summary.json)
          echo "p95=${P95}ms  error_rate=${ERR}  achieved=${RPS}/s"
          awk -v p="$P95" -v e="$ERR" 'BEGIN{exit !(p < 400 && e < 0.01)}' || {
            echo "::error::SLO gate failed - p95=${P95}ms (<400) err=${ERR} (<0.01) at ${RPS}/s"
            exit 1
          }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary
          path: k6-summary.json
      - if: always()
        run: docker compose --profile core logs --tail=120

  # ------------------------------------------------------------------- helm
  helm:
    name: helm lint and template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/tracemap
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - name: render, then assert the invariants
        # Checked against the RENDERED manifests rather than the values file,
        # because the failure mode is a template that puts a readiness path
        # into a liveness probe -- which values-level review cannot see.
        # scripts/probe-guard.sh proves the same thing at runtime by actually
        # stopping Postgres; this is the static half that runs without a
        # cluster.
        run: |
          python -m pip install --quiet PyYAML
          helm template tracemap charts/tracemap > /tmp/rendered.yaml
          python scripts/helm-guard.py --manifest /tmp/rendered.yaml
