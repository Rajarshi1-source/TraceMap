# Jaeger v2.20 - STORAGE_PROFILE=badger
#
# Embedded key-value store, zero infrastructure. This is the default so a first
# boot needs nothing, and so a ClickHouse problem can never be mistaken for an
# instrumentation problem.
#
# M10 - this is Jaeger v2: ONE binary built on the OpenTelemetry Collector
# framework, configured by this YAML. There is no jaeger-agent, no separate
# jaeger-collector and no jaeger-query binary; v1 reached end of life on
# 31 Dec 2025 and those components no longer exist.

service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133

  jaeger_query:
    storage:
      traces: main_store
    http:
      endpoint: 0.0.0.0:16686
    grpc:
      endpoint: 0.0.0.0:16685

  jaeger_storage:
    backends:
      main_store:
        badger:
          directories:
            keys: /var/lib/jaeger/keys
            values: /var/lib/jaeger/values
          ephemeral: false

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 512

exporters:
  jaeger_storage_exporter:
    trace_storage: main_store
