# OTel Collector v0.158.x - AGENT TIER (DaemonSet, one per node).
#
# Used by the Helm chart in Phase 7, not by docker-compose. Its only jobs are to
# take telemetry off the application processes as fast as possible, enrich it
# with Kubernetes metadata, and route it to the gateway tier BY TRACE ID.
#
# It does NO sampling. A sampling decision here would be made on a partial
# trace, because a node only ever sees the spans produced on that node.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

  # Enriches spans with pod/namespace/deployment, which is what lets the deploy
  # watcher in Phase 6 correlate an anomaly to a rollout.
  k8sattributes:
    auth_type: serviceAccount
    passthrough: false
    extract:
      metadata:
        - k8s.pod.name
        - k8s.namespace.name
        - k8s.deployment.name
        - k8s.node.name

  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  # M13 - this is NOT optional once the gateway tier has more than one replica.
  # `routing_key: traceID` is the whole point: it guarantees every span of a
  # trace lands on the same gateway instance, which is what tail sampling
  # requires. Without it, spans scatter, each replica sees a fragment, and
  # sampling decisions become arbitrary in a way nobody notices until the data
  # looks thin.
  loadbalancing:
    routing_key: traceID
    protocol:
      otlp:
        tls:
          insecure: true
        sending_queue:
          enabled: true
          storage: file_storage
        retry_on_failure:
          enabled: true
    resolver:
      k8s:
        service: otel-gateway.observability.svc.cluster.local
        ports: [4317]

extensions:
  file_storage:
    directory: /var/lib/otelcol/queue
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [file_storage, health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, k8sattributes, batch]
      exporters: [loadbalancing]
  telemetry:
    metrics:
      level: detailed
